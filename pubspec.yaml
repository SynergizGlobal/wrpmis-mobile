name: wr_pmis_mobile
description: "Western Railways Project Management Information System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cached_network_image: ^3.4.1
  cookie_jar: ^4.0.8
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  equatable: ^2.0.7
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_remote_config: ^6.5.6
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  go_router: ^16.0.0
  intl: ^0.20.2
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/update_forms_icons/
    - assets/dashboard_slides/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#D58D54"
  adaptive_icon_foreground: assets/app_icon.png
  remove_alpha_ios: true
